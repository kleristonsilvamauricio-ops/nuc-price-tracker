<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12335b">
  <meta name="description" content="Compare produtos, lojas e montagens no Brasil e nos EUA. Histórico, metas e backup no seu dispositivo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./src/styles.css?v=2.0.0">
  <title>Price Tracker · Brasil & EUA</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#products" aria-label="Price Tracker, produtos">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7l9 9-7 7-9-9V4Z"/><circle cx="8" cy="8" r="1"/><path d="m10 14 2-2 3 1"/></svg></span>
        <span>Price Tracker<small>Brasil & Estados Unidos</small></span>
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <button data-view="products" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Produtos</button>
        <button data-view="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V9m7 11V4m7 16v-7M3 20h18"/></svg>Comparar</button>
        <button data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/></svg>Histórico</button>
        <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg>Ajustes</button>
      </nav>
      <span class="private-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Dados no dispositivo</span>
    </header>
    <div id="app" aria-live="polite"><div class="loading-shell"><span class="loading-spinner"></span><h1>Preparando suas pesquisas</h1><p>Carregando produtos e histórico deste dispositivo.</p></div></div>
    <footer class="footer"><span>Price Tracker Universal · v2.0.0</span><span><a href="./legacy/">NUC original</a> · <a href="https://github.com/kleristonsilvamauricio-ops/nuc-price-tracker" target="_blank" rel="noopener noreferrer">Código do projeto</a></span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <noscript><div class="panel">Ative o JavaScript no navegador para cadastrar produtos e comparar preços.</div></noscript>
  <script type="module" src="./src/app.js?v=2.0.0"></script>
</body>
</html>
